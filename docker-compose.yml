# Crossyword Docker Compose Configuration
# Compatible with Coolify deployment

services:
  crossyword:
    build:
      context: .
      dockerfile: Dockerfile
    image: crossyword:latest
    container_name: crossyword
    restart: unless-stopped
    ports:
      - "${CROSSYWORD_PORT:-1965}:1965"
    volumes:
      - /data/crossyword/data:/app/data
      - /data/crossyword/puzzles:/app/puzzles
      - /data/crossyword/certs:/app/certs
    environment:
      - CROSSYWORD_DATABASE_URL=${CROSSYWORD_DATABASE_URL:-sqlite:////app/data/crossyword.db}
      - CROSSYWORD_PUZZLES_DIR=${CROSSYWORD_PUZZLES_DIR:-/app/puzzles}
      - CROSSYWORD_HOST=${CROSSYWORD_HOST:-0.0.0.0}
      - CROSSYWORD_PORT=${CROSSYWORD_PORT:-1965}
      - CROSSYWORD_CERTFILE=${CROSSYWORD_CERTFILE:-/app/certs/cert.pem}
      - CROSSYWORD_KEYFILE=${CROSSYWORD_KEYFILE:-/app/certs/key.pem}
    healthcheck:
      test: ["CMD", "pgrep", "-f", "crossyword"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
