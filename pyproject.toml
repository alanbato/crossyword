[project]
name = "crossyword"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alan Velasco", email = "alanvelasco.a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nauyaca[reload]>=0.9.0",
    "puzpy>=0.3.0",
    "xitzin[sqlmodel]>=0.3.0",
]

[project.scripts]
crossyword = "crossyword:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]
